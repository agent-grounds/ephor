# Run the CI-equivalent local gate before every commit, and re-run the test
# suite before every push. Every hook here mirrors a step in
# .github/workflows/ci.yml — match the CI gate, do not add a stricter one.
#
# One-time setup:
#   pip install pre-commit
#   pre-commit install   # installs pre-commit, pre-push, and commit-msg hooks
default_install_hook_types: [pre-commit, pre-push, commit-msg]
repos:
  - repo: local
    hooks:
      #   - `cargo fmt --all -- --check` matches the CI `cargo fmt --check` step.
      #   - `cargo build --all-targets --locked` with `RUSTFLAGS=-Dwarnings`
      #     matches the CI build step and its `RUSTFLAGS: "-D warnings"` env. The
      #     `env` prefix is just `/usr/bin/env` so the variable applies to the
      #     single cargo invocation without depending on shell-syntax expansion
      #     in pre-commit's argv split. Clippy is intentionally **not** part of
      #     CI, so it is intentionally not here either.
      #   - `cargo test --all-targets --locked` matches the CI `cargo test` step
      #     and also runs at pre-push so broken tests block both commit-time and
      #     push-time workflows.
      #   - `scripts/check_changelog_pr_entry.py --local-pr` is the CI changelog
      #     gate reached at the push instead — one predicate at two moments
      #     (§FS-002-release.6), which is what keeps it matching rather than
      #     exceeding. It asks for an entry file under `docs/changelog/unreleased/`
      #     whose slug the base did not have, a question answerable before a
      #     pull request exists, and adds the number clause only when `gh`
      #     reports a number.
      #     It refuses the push rather than standing down; the refusal names
      #     `SKIP=changelog-pr-entry git push`, which drops this hook alone and
      #     leaves `cargo-test` below still running.
      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: cargo-build
        name: cargo build (warnings as errors)
        entry: env RUSTFLAGS=-Dwarnings cargo build --all-targets --locked
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets --locked
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: changelog-pr-entry
        name: changelog PR entry
        entry: python scripts/check_changelog_pr_entry.py --local-pr
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: python-test
        name: python tests
        entry: python -m unittest discover -s tests/integration -p test_*.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Requires the pinned `grund` on PATH, which is the release CI
      # installs and the one that wrote the v10 block in both entrypoints
      # (§FS-002-release.7):
      #     cargo install grund --version 0.14.0 --locked
      # Another version reaches another verdict on an untouched tree.
      #
      # `local-section-citation` is held out, and only that code. The same
      # selection is in `.github/workflows/ci.yml` and the `justfile`, and it
      # has to stay that way: a code held out here and checked there is one
      # tree with two verdicts, which is the failure this pinning exists to
      # stop. It flags a bare section number written in prose, a rule grund
      # 0.13.0 did not carry; the sites it names are the editorial pass
      # recorded in pull request 146, and finishing it deletes this flag.
      - id: grund-check
        name: grund check
        entry: grund check --ignore local-section-citation
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: grund-fmt
        name: grund fmt
        entry: grund fmt --write
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # `fissile check` holds every file to the budget its reader sets
      # (§FS-012-file-size.2): the rules and their derivations are in
      # `.agent-grounds/fissile.toml`, which fissile discovers on its own from
      # 0.8.3 forward — no `--config` flag anywhere
      # (§FS-006-project-interface.12). Like `grund`, this calls an installed
      # binary rather than `cargo run` — it is a third-party tool, not this
      # repository's own (cargo install fissile --version 0.8.3). Soft overflows
      # warn and exit 0; the only way past a hard one is a reviewed entry in
      # `docs/file-size-human-exceptions.toml`. `pass_filenames` is true so the
      # hook measures exactly the files the commit touches, and
      # `pre-commit run --all-files` measures the whole tree, which is what the
      # `fissile` job in CI runs.
      - id: fissile-check
        name: fissile (file size budgets)
        entry: fissile check
        language: system
        pass_filenames: true
        stages: [pre-commit]
      # §FS-001-forge-interface.5. Runs against staged content, so a private
      # word is caught before the commit exists rather than before a push. The
      # word list is local and gitignored — see the script — so this hook is a
      # no-op for anyone who has not written one, which is why CI cannot be
      # the enforcement point.
      - id: private-words
        name: no private words (staged files)
        entry: scripts/check-private-words.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: private-words-commit-msg
        name: no private words (commit message)
        entry: scripts/check-private-words.sh
        language: system
        pass_filenames: true
        always_run: true
        stages: [commit-msg]
      - id: no-claude-attribution
        name: no Claude attribution boilerplate (staged files)
        entry: scripts/check-no-claude-attribution.sh
        language: system
        # Run against staged file content. The script accepts the file list
        # pre-commit passes. The script's own source documents the patterns it
        # blocks; exclude it so the hook does not flag itself.
        pass_filenames: true
        exclude: ^scripts/check-no-claude-attribution\.sh$
        stages: [pre-commit]
      - id: no-claude-attribution-commit-msg
        name: no Claude attribution boilerplate (commit message)
        entry: scripts/check-no-claude-attribution.sh
        language: system
        # Same script, second stage. pre-commit passes the commit-message file
        # as the single argument; the script greps it with the same patterns as
        # the staged-files hook.
        stages: [commit-msg]
        pass_filenames: true
        always_run: true
